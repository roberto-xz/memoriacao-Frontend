
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="roberto-xz"/>
    <title>Visualizador AR - MemoriAção</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
    
    <!-- <script src="vendor/aframe.min.js"></script>
    <script src="vendor/aframe-ar.js"></script> -->
    
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #loading {
            position: fixed; inset: 0; background: #fff; z-index: 9999;
            display: flex; align-items: center; justify-content: center; text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div>
            <h2>Carregando</h2>
            <p>Por favor aguarde </p>
        </div>
    </div>
    <a-scene 
        embedded arjs="sourceType: webcam; debugUIEnabled: false;" 
        vr-mode-ui="enabled: false">

        <a-marker preset="hiro">
            <a-entity id="entity-model"></a-entity>
             <!-- <a-box position="0 0.5 0" scale="1 1 1" color="red"></a-box> -->
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        function check_origem() {
            const referrer = document.referrer;
            const isIframe = window.self !== window.top;
            const isAuthorized = isIframe && (referrer.includes('memoriacao.github.io'));

            if (!isAuthorized)
                window.location.href = "https://memoriacao.github.io/site";
        
            return;
        }

        window.onload = function() {
            // check_origem()
            const urlParams = new URLSearchParams(window.location.search);
            const el = document.getElementById('entity-model');

            const config = {
                model: 'models/'+urlParams.get('m'),
                pos:   urlParams.get('p') || "0 0.5 0",
                rot:   urlParams.get('r') || "0 0 0",
                scale: urlParams.get('s') || "0.2 0.2 0.2"
            };
            
            el.setAttribute('gltf-model', config.model);
            el.setAttribute('position', config.pos);
            el.setAttribute('rotation', config.rot);
            el.setAttribute('scale', config.scale);
            el.setAttribute('animation-mixer', ''); 
            document.getElementById('loading').style.display = 'none';
        };
    </script>
</body>
</html>
