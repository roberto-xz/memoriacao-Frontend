<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador 3D</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #d3d3d3;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>

    <script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>
</head>

<body>

    <div id="debugPanel" style="
position:fixed;
top:10px;
right:10px;
background:rgba(0,0,0,0.85);
color:#00ff88;
font-family:monospace;
font-size:12px;
padding:12px;
border-radius:1px;
z-index:999;
max-width:320px;">
        <div id="debugData"></div>
        <button id="copyBtn" style="
margin-top:8px;
width:100%;
background:#00aa66;
border:none;
padding:6px;
cursor:pointer;
color:white;
border-radius:1px;">
            Copiar URL
        </button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const params = new URLSearchParams(window.location.search);

        function parseVec(param, fallback) {
            if (!param) return fallback;
            const v = param.split(',').map(Number);
            return v.length === 3 && v.every(n => !isNaN(n)) ? v : fallback;
        }

        const modelName = params.get("model") || "if_logo.glb";
        const camParam = parseVec(params.get("cam"), null);
        const targetParam = parseVec(params.get("target"), null);
        const fovParam = parseFloat(params.get("fov"));

        const isLocal = window.location.hostname === "localhost" ||
            window.location.hostname === "127.0.0.1";

        const debugMode = params.get("debug") === "true" || isLocal;

        const debugPanel = document.getElementById("debugData");
        const copyButton = document.getElementById("copyBtn");

        if (!debugMode) {
            debugPanel.style.display = "none";
            copyButton.style.display = "none";
        }

        const modelPath = `/site/models/${modelName}`;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(
            !isNaN(fovParam) ? fovParam : 60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        if (camParam) {
            camera.position.set(...camParam);
        } else {
            camera.position.set(0, 2, 6);
        }

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.07;
        controls.enableZoom = false;

        if (targetParam) {
            controls.target.set(...targetParam);
        }

        const minFov = 25;
        const maxFov = 75;

        function applyZoom(delta) {
            camera.fov += delta * 0.05;
            camera.fov = Math.max(minFov, Math.min(maxFov, camera.fov));
            camera.updateProjectionMatrix();
        }

        renderer.domElement.addEventListener("wheel", e => {
            e.preventDefault();
            applyZoom(e.deltaY);
        });

        let lastDistance = null;

        renderer.domElement.addEventListener("touchmove", e => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (lastDistance !== null) {
                    applyZoom(lastDistance - dist);
                }
                lastDistance = dist;
            }
        }, { passive: false });

        renderer.domElement.addEventListener("touchend", () => {
            lastDistance = null;
        });

        const loader = new GLTFLoader();

        loader.load(modelPath, gltf => {
            const model = gltf.scene;
            scene.add(model);

            if (!camParam) {
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                model.position.sub(center);

                const maxDim = Math.max(size.x, size.y, size.z);
                camera.position.set(0, maxDim * 0.5, maxDim * 1.5);
                controls.target.set(0, 0, 0);
            }

            controls.update();
        });

        const debugData = document.getElementById("debugData");
        const copyBtn = document.getElementById("copyBtn");

        function updateDebug() {
            const cam = camera.position;
            const target = controls.target;

            debugData.innerHTML = `
<b>Cam:</b> ${cam.x.toFixed(3)}, ${cam.y.toFixed(3)}, ${cam.z.toFixed(3)}<br>
<b>Target:</b> ${target.x.toFixed(3)}, ${target.y.toFixed(3)}, ${target.z.toFixed(3)}<br>
<b>FOV:</b> ${camera.fov.toFixed(2)}
`;

            return `?model=${modelName}&cam=${cam.x.toFixed(4)},${cam.y.toFixed(4)},${cam.z.toFixed(4)}&target=${target.x.toFixed(4)},${target.y.toFixed(4)},${target.z.toFixed(4)}&fov=${camera.fov.toFixed(2)}`;

        }

        copyBtn.onclick = () => {
            const url = window.location.origin + window.location.pathname + updateDebug();
            navigator.clipboard.writeText(url);
            copyBtn.innerText = "Copiado!";
            setTimeout(() => copyBtn.innerText = "Copiar URL", 1000);
        };
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            updateDebug();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>

</html>
