<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="roberto-xz"/>
    <title>Visualizador AR - MemoriAção</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        #loading {
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        /* DEBUG PANEL */
        #debug-panel {
            position: fixed;
            bottom: 8px;
            left: 8px;
            padding: 8px 10px;
            background: rgba(0, 0, 0, 0.65);
            color: #0f0;
            font-size: 11px;
            font-family: monospace;
            z-index: 10000;
            pointer-events: none;
            white-space: pre;
        }
    </style>
</head>

<body>
    <div id="loading">
        <div>
            <h2>Carregando</h2>
            <p>Por favor aguarde</p>
        </div>
    </div>

    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;"
        vr-mode-ui="enabled: false">

        <a-marker id="marker" preset="hiro">
            <a-entity id="entity-model"></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        /* ===========================
           SEGURANÇA / ORIGEM
        =========================== */
        function check_origem() {
            const referrer   = document.referrer;
            const isIframe   = window.self !== window.top;
            const authorized = isIframe && referrer.includes('memoriacao.github.io');

            if (!authorized)
                window.location.href = 'https://memoriacao.github.io/site';
        }

        /* ===========================
           DEBUG (ISOLADO)
        =========================== */
        function create_debug_panel(config, marker) {
            const panel = document.createElement('div');
            panel.id = 'debug-panel';
            document.body.appendChild(panel);

            function update() {
                panel.textContent =
`AR DEBUG
-------------------------
model: ${config.model}

position: ${config.pos}
rotation: ${config.rot}
scale:    ${config.scale}

marker visible: ${marker.object3D.visible}
iframe: ${window.self !== window.top}
referrer: ${document.referrer || 'direct'}`;
            }

            const interval = setInterval(update, 500);

            return () => {
                clearInterval(interval);
                panel.remove();
            };
        }

        /* ===========================
           INIT
        =========================== */
        window.onload = function () {
            // check_origem();

            const params = new URLSearchParams(window.location.search);
            const el     = document.getElementById('entity-model');
            const marker = document.getElementById('marker');

            const config = {
                model: 'models/' + params.get('m'),
                pos:   params.get('p') || '0 0.5 0',
                rot:   params.get('r') || '0 0 0',
                scale: params.get('s') || '0.2 0.2 0.2'
            };

            el.setAttribute('gltf-model', config.model);
            el.setAttribute('position',   config.pos);
            el.setAttribute('rotation',   config.rot);
            el.setAttribute('scale',      config.scale);
            el.setAttribute('animation-mixer', '');

            document.getElementById('loading').style.display = 'none';

            /* DEBUG (comente esta linha para desligar) */
            // create_debug_panel(config, marker);
        };
    </script>
</body>
</html>
